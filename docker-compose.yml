services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: biopet-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-biopet_db}
      POSTGRES_USER: ${DB_USER:-biopet_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-biopet_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Unico script de inicializacion automatica: bootstrap MINIMO del
      # rol biopet_app (CREATE ROLE + CONNECT + USAGE ON SCHEMA), sin
      # ninguna dependencia de tablas/secuencias/funciones/procedimientos.
      # Ver db/roles-bootstrap.sql para el porque.
      - ./db/roles-bootstrap.sql:/docker-entrypoint-initdb.d/01-roles-bootstrap.sql:ro
      # NO montar aqui, deliberadamente:
      #   - db/schema.sql (duplicaba V1; enmascaraba V1 detras de
      #     "baseline-on-migrate: true" en un volumen que parecia nuevo);
      #   - db/seed.sql (redundante: Backend/.../config/DataInitializer.java,
      #     CommandLineRunner "seedAdmin", crea el mismo admin de forma
      #     idempotente DESPUES de que Flyway corre, sin depender de
      #     docker-entrypoint-initdb.d -B-1: ese seed es ahora opt-in via
      #     ADMIN_SEED_ENABLED=true, ADMIN_SEED_EMAIL y ADMIN_SEED_PASSWORD;
      #     .env.example ya trae esas 3 variables para desarrollo local, asi
      #     que "docker compose up" con un .env copiado desde .env.example
      #     sigue creando el mismo admin de siempre sin cambios de flujo);
      #   - db/procs/ y db/init-procs.sh (db/procs/*.sql ya representa el
      #     estado FINAL v1.0.0 de las 6 rutinas -- todas PROCEDURE --;
      #     precargarlas en un volumen nuevo hace que la migracion V5
      #     -que crea las 4 fn_* como FUNCTION, estado historico- falle
      #     con "cannot change routine kind" al chocar con las PROCEDURE
      #     ya existentes).
      # Flyway (V1->V6, ejecutado por Spring Boot al arrancar el backend)
      # es la UNICA fuente de evolucion automatica del esquema. Los
      # privilegios de biopet_app sobre tablas/secuencias/funciones/
      # procedimientos se otorgan DESPUES de Flyway, desde el callback
      # Backend/src/main/resources/db/migration/afterMigrate.sql (misma
      # conexion que ejecuta las migraciones). db/schema.sql, db/seed.sql,
      # db/procs/ y db/init-procs.sh se conservan como catalogo/evidencia/
      # historial, sin ejecutarse automaticamente al inicializar Postgres.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-biopet_user} -d ${DB_NAME:-biopet_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: biopet-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./Backend
    container_name: biopet-backend
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  frontend:
    build: ./frontend
    container_name: biopet-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

volumes:
  postgres_data: