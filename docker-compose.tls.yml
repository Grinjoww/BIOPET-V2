# Compose complementario para HTTPS/TLS 1.3 nativo en el backend.
# No reemplaza a docker-compose.yml: se usa junto a el.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up --build
#
# Requiere un keystore local generado previamente (no versionado) con:
#   scripts/generate-dev-keystore.ps1   (Windows)
#   scripts/generate-dev-keystore.sh    (Linux/macOS)
#
# No modifica postgres, redis ni frontend. No usa network_mode.
# No deshabilita ninguna verificacion TLS: solo agrega el conector HTTPS del backend.

services:
  backend:
    ports:
      - "8443:8443"
    environment:
      SPRING_PROFILES_INCLUDE: tls
      TLS_KEYSTORE_PATH: file:/app/certs/biopet-dev.p12
      TLS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD:-changeit}
      TLS_KEY_ALIAS: ${TLS_KEY_ALIAS:-biopet-local}
      TLS_HTTPS_PORT: "8443"
      TLS_HTTP_PORT: "8080"
    volumes:
      - ./Backend/certs:/app/certs:ro
