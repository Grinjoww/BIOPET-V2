# render.yaml — Despliegue de BIOPET en Render (F08)
# Blueprint (IaC) de Render. Los valores de entorno sensibles se definen en el
# dashboard de Render (sync: false) o se generan (generateValue); NINGUN secreto
# real esta versionado en este archivo.
#
# Como usar (resumen, ver docs/despliegue/DEPLOYMENT.md):
#   1. Conectar el repositorio https://github.com/Grinjoww/BIOPET-V2
#      en Render (New -> Blueprint).
#   2. Render lee este archivo y crea: biopet-v2-backend (web docker),
#      biopet-v2-frontend (web docker), biopet-v2-cache (key value) y
#      biopet-v2-db (Postgres). Nombres con sufijo "-v2-" a proposito: el
#      BIOPET academico (V1) original sigue desplegado en el mismo
#      workspace de Render con los nombres SIN sufijo (biopet-backend,
#      biopet-frontend, biopet-cache, biopet-db) -- sufijar V2 evita
#      colisionar o confundirse con esos recursos, que no deben tocarse.
#   3. Completar en el dashboard las variables marcadas con sync: false
#      (JWT_SECRET, CORS_ALLOWED_ORIGINS, ADMIN_SEED_EMAIL,
#      ADMIN_SEED_PASSWORD, TLS_KEYSTORE_*). BACKEND_URL YA NO es sync:false
#      -se resuelve solo (ver punto 5).
#   4. El healthcheck del backend usa /actuator/health (HTTP 200 = UP).
#   5. BACKEND_URL del frontend se resuelve automaticamente via
#      fromService/envVarKey: RENDER_EXTERNAL_URL apuntando a
#      biopet-v2-backend (ver el bloque "envVars" de biopet-v2-frontend mas
#      abajo) -- sin sync:false, sin URL hardcodeada, sin paso manual de
#      "desplegar backend, copiar URL, pegarla en frontend". B-2 queda
#      resuelto en su totalidad por este Blueprint.
#   6. Bootstrap del primer ADMIN (B-1): ADMIN_SEED_ENABLED nace en "false"
#      (value: mas abajo, no sync:false) para que el Blueprint aplique sin
#      crear ninguna cuenta. Para el primer deploy real, editar esa
#      variable a "true" en el dashboard (junto con ADMIN_SEED_EMAIL /
#      ADMIN_SEED_PASSWORD ya completados) y volver a "false" despues de
#      confirmar que el admin quedo creado (ver DataInitializer y
#      docs/despliegue/DEPLOYMENT.md seccion 7).

services:
  # ------------------------------------------------------------------
  # Backend Spring Boot (docker)
  # ------------------------------------------------------------------
  - type: web
    name: biopet-v2-backend
    runtime: docker
    repo: https://github.com/Grinjoww/BIOPET-V2
    rootDir: Backend
    plan: free
    # NO usar una expresion "sh -c '...'" embebida como string aqui: Render
    # interpreta dockerCommand como un unico programa a ejecutar (sin pasar
    # por un shell propio), asi que una cadena "sh -c 'export ... && exec
    # ...'" termina siendo tratada literalmente como el NOMBRE del
    # programa -> "not found" (exit 127). En su lugar se referencia
    # directamente el script Backend/render-entrypoint.sh (copiado y
    # marcado ejecutable en el Dockerfile), que construye DB_URL a partir
    # de DB_HOST/DB_PORT/DB_NAME y luego hace "exec java -jar app.jar".
    dockerCommand: /app/render-entrypoint.sh
    healthCheckPath: /actuator/health
    envVars:
      # Postgres gestionado de Render (valores reales enlazados por Render)
      # Propiedades validas de "fromDatabase" segun Render: host, port,
      # database, user, password (NO "hostname" ni "databaseName" -- esos
      # nombres son los del campo "databases:" mas abajo, no propiedades
      # referenciables desde envVars; Render rechazo el Blueprint con
      # "hostname es invalido" / "databaseName es invalido" hasta corregir
      # esto).
      - key: DB_HOST
        fromDatabase:
          name: biopet-v2-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: biopet-v2-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: biopet-v2-db
          property: database
      # Usuario de aplicacion: rol con privilegios sobre las tablas.
      # En Render se usa el rol de la BD gestionada (ver DEPLOYMENT.md,
      # seccion "Rol de aplicacion").
      - key: DB_APP_USER
        fromDatabase:
          name: biopet-v2-db
          property: user
      - key: DB_APP_PASSWORD
        fromDatabase:
          name: biopet-v2-db
          property: password
      - key: DB_USER
        fromDatabase:
          name: biopet-v2-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: biopet-v2-db
          property: password
      # Redis / Valkey gestionado de Render (Key Value). Render NO expone
      # "host"/"port" como propiedades separadas de un servicio "keyvalue"
      # via fromService (a diferencia de "databases:", que si expone
      # host/port/database/user/password) -- solo expone
      # "connectionString" (URL completa redis://... con credenciales
      # incluidas). Backend/src/main/resources/application.yml usa
      # spring.data.redis.host/port (${REDIS_HOST}/${REDIS_PORT}), que no
      # se puede alimentar con una URL. Spring Boot (spring-boot-starter-
      # data-redis) SI soporta nativamente la propiedad alternativa
      # spring.data.redis.url (variable de entorno equivalente:
      # SPRING_DATA_REDIS_URL, sin cambiar application.yml ni codigo
      # Java): cuando esa URL esta presente, Spring Data Redis la usa en
      # vez de host/port (host/port quedan en su valor por defecto
      # "localhost"/6379 de application.yml, pero se ignoran). Por eso se
      # inyecta unicamente SPRING_DATA_REDIS_URL aqui, sin REDIS_HOST ni
      # REDIS_PORT.
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: biopet-v2-cache
          property: connectionString
      # Valores que el operador completa en el dashboard (sync: false)
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "3600000"
      - key: JWT_REFRESH_EXPIRATION_MS
        value: "604800000"
      - key: JWT_ISSUER
        value: biopet-api
      - key: JWT_AUDIENCE
        value: biopet-frontend
      - key: CACHE_TTL_MS
        value: "300000"
      # B-1: bootstrap opcional del primer ADMIN (ver DataInitializer y
      # Backend/src/main/resources/application.yml, app.admin-seed.*).
      # ADMIN_SEED_ENABLED nace deshabilitado (value fijo, no sync:false)
      # para que el Blueprint se pueda aplicar sin crear ninguna cuenta;
      # el operador lo cambia a "true" en el dashboard SOLO para el deploy
      # de bootstrap y lo vuelve a poner en "false" despues. EMAIL/PASSWORD
      # son sync:false -- sin ningun valor ni fallback en este archivo: se
      # completan en el dashboard con datos reales antes de habilitar el
      # seed. NUNCA usar aqui la credencial de desarrollo (Admin123*) de
      # .env.example / db/seed.sql.
      - key: ADMIN_SEED_ENABLED
        value: "false"
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: ADMIN_SEED_NAME
        value: "Administrador BIOPET"

  # ------------------------------------------------------------------
  # Frontend Angular (docker + nginx). El proxy /api hacia el backend se
  # resuelve en runtime dentro del contenedor (frontend/docker-entrypoint.sh
  # + nginx.conf.template), usando BACKEND_URL definido abajo.
  #
  # NO se usa el hostname PRIVADO de Render (fromService/property: host)
  # aqui: verificado en un deploy real (instancia V1/academica) que el plan
  # Free de Web Services de Render puede ENVIAR trafico por la red privada
  # pero NO puede RECIBIRLO (un backend Free no admite conexiones entrantes
  # por esa red desde otro servicio) -- el intento fallo entonces con "host
  # not found in upstream". Por eso BACKEND_URL debe ser la URL HTTPS
  # PUBLICA real del backend, no su hostname privado de Render.
  #
  # B-2 (resuelto): BACKEND_URL se obtiene automaticamente, dentro de este
  # mismo Blueprint, via fromService/envVarKey: RENDER_EXTERNAL_URL --
  # RENDER_EXTERNAL_URL es una variable que Render inyecta a TODO Web
  # Service con su propia URL publica HTTPS (sin puerto), disponible desde
  # que el servicio se crea (no hace falta que termine de compilar/arrancar
  # para que el valor exista). Referenciar aqui biopet-v2-backend (el
  # servicio definido arriba, no el backend academico V1) hace que Render
  # resuelva esta variable solo, sin sync:false, sin URL hardcodeada, y sin
  # el paso manual "desplegar backend, copiar URL, pegarla en frontend": el
  # Blueprint completo (Postgres + Redis + backend + frontend) se puede
  # aplicar en una sola operacion. docker-entrypoint.sh/nginx.conf.template
  # ya aceptan una URL completa "https://..." sin cambios (ver
  # proxy_ssl_server_name para el SNI que ese esquema necesita).
  # ------------------------------------------------------------------
  - type: web
    name: biopet-v2-frontend
    runtime: docker
    repo: https://github.com/Grinjoww/BIOPET-V2
    rootDir: frontend
    plan: free
    healthCheckPath: /
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: biopet-v2-backend
          envVarKey: RENDER_EXTERNAL_URL

  # ------------------------------------------------------------------
  # Redis / Valkey gestionado (cache)
  # ------------------------------------------------------------------
  - type: keyvalue
    name: biopet-v2-cache
    plan: free
    # Obligatorio para Render (Blueprint rechazado sin esto: "must
    # specify IP allow list"). Lista vacia = sin acceso publico por IP;
    # solo alcanzable por la conexion interna de Render (biopet-v2-backend,
    # mismo proyecto/region), via SPRING_DATA_REDIS_URL arriba.
    ipAllowList: []

# ------------------------------------------------------------------
# Postgres gestionado (datos de produccion)
# Nota: el plan free de Postgres se elimina a los 30 dias de crearse;
# para datos de produccion permanentes usar plan starter o superior.
# ------------------------------------------------------------------
databases:
  # "name:" es el identificador del recurso Blueprint (dashboard/fromDatabase),
  # distinto de "databaseName:"/"user:" -el nombre real de la base y el rol
  # Postgres que Render crea. Solo se renombra "name:" (biopet-v2-db) para
  # distinguir este recurso del Postgres academico en el mismo workspace de
  # Render; "databaseName"/"user" quedan igual que siempre (biopet_db /
  # biopet_user), sin relacion con Render y sin efecto funcional: son los
  # mismos nombres que ya esperan Backend/src/main/resources/application.yml
  # (defaults de desarrollo) y db/roles.sql (bootstrap local).
  - name: biopet-v2-db
    databaseName: biopet_db
    user: biopet_user
    plan: free