# nginx-render.conf — HISTORICO / YA NO SE USA.
#
# Enfoque anterior #1: copiar este archivo a mano sobre frontend/nginx.conf
# antes de cada deploy a Render, hardcodeando el hostname "biopet-backend".
# En un deploy real, Render fallo con
# "host not found in upstream 'backend'" porque ese paso manual no se
# habia aplicado (el nginx.conf local seguia apuntando a "backend").
#
# Enfoque anterior #2 (tambien abandonado, NO reproducir): reemplazar el
# paso manual por frontend/nginx.conf.template + docker-entrypoint.sh
# generando el proxy con BACKEND_HOST/BACKEND_PORT inyectados por
# render.yaml via Blueprint "fromService" sobre el hostname PRIVADO de
# biopet-backend. En un deploy real con biopet-backend ya desplegado,
# Render volvio a fallar con
# "host not found in upstream 'biopet-backend-dh5e'": con **Web Services
# en plan Free**, un servicio Free puede enviar trafico por la red
# privada de Render pero NO puede recibirlo -- el frontend Free no puede
# alcanzar al backend Free por su hostname privado bajo ningun nombre.
#
# Solucion actual: el mismo mecanismo de plantilla + entrypoint, pero
# usando la variable BACKEND_URL con la URL HTTPS PUBLICA real del
# backend (para esta instancia, https://biopet-backend-dh5e.onrender.com),
# inyectada por render.yaml como valor fijo (no un hostname privado). En
# Docker Compose local, el default sigue siendo http://backend:8080. Ver
# docs/despliegue/DEPLOYMENT.md, seccion 5.1.
#
# Se conserva este archivo solo como referencia historica; no se copia ni
# se usa en el Dockerfile del frontend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://biopet-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}