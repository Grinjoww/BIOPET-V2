# nginx-render.conf — Configuracion de nginx para el frontend en Render.
# Reemplaza a frontend/nginx.conf durante el despliegue en Render (F08):
# el proxy /api apunta al nombre INTERNO del servicio backend de Render
# (biopet-backend), no al servicio docker-compose local (backend).
#
# Como aplicar (ver docs/despliegue/DEPLOYMENT.md):
#   cp docs/despliegue/nginx-render.conf frontend/nginx.conf
# y committear ese cambio antes del deploy (o hacerlo en la rama de deploy).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://biopet-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}