# nginx-render.conf — HISTORICO / YA NO SE USA.
#
# Enfoque anterior: copiar este archivo a mano sobre frontend/nginx.conf
# antes de cada deploy a Render, hardcodeando el hostname "biopet-backend".
# En un deploy real, Render fallo con
# "host not found in upstream 'backend'" porque ese paso manual no se
# habia aplicado (el nginx.conf local seguia apuntando a "backend").
#
# Reemplazado por un mecanismo automatico que no requiere copiar ningun
# archivo ni hardcodear el hostname: frontend/nginx.conf.template +
# frontend/docker-entrypoint.sh generan el proxy /api en tiempo de
# arranque del contenedor usando BACKEND_HOST/BACKEND_PORT, inyectados
# por render.yaml (Blueprint fromService sobre el servicio real
# biopet-backend) en Render, o por defaults (backend:8080) en Docker
# Compose local. Ver docs/despliegue/DEPLOYMENT.md, seccion 5.1.
#
# Se conserva este archivo solo como referencia historica del enfoque
# anterior; no se copia ni se usa en el Dockerfile del frontend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://biopet-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}