server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/biopet_db}
    username: ${DB_APP_USER:biopet_app}
    # Sin fallback: una contrasena de aplicacion es un secreto, no un valor de
    # ejemplo. Si DB_APP_PASSWORD no esta definida, el arranque debe fallar
    # (ver .env.example para el valor de desarrollo documentado).
    password: ${DB_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    user: ${DB_USER:biopet_user}
    # Sin fallback: misma razon que spring.datasource.password arriba.
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: ${CACHE_TTL_MS:300000}
      cache-null-values: false

security:
  jwt:
    # Sin fallback: un secreto HMAC conocido en el repositorio no es un
    # secreto. Si JWT_SECRET no esta definida, el arranque debe fallar
    # (JwtService ademas exige >=256 bits una vez resuelta la variable).
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    issuer: ${JWT_ISSUER:biopet-api}
    audience: ${JWT_AUDIENCE:biopet-frontend}
  cookie:
    access-name: access_token
    refresh-name: refresh_token
    secure: true
    same-site: Strict

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  external-api:
    # APP_EXTERNAL_API_KEY ya se resolvia por relaxed binding de Spring
    # (SystemEnvironmentPropertySource) aunque esta clave no estuviera
    # declarada aqui; se declara explicitamente solo por documentacion/
    # descubribilidad. Sigue siendo opcional (default vacio): la API
    # externa (Animal API Ninjas) no es un requisito para arrancar BIOPET.
    key: ${APP_EXTERNAL_API_KEY:}
  admin-seed:
    # B-1: bootstrap opcional y explicito del primer ADMIN (ver
    # DataInitializer). Default deshabilitado -sin ADMIN_SEED_ENABLED=true no
    # se crea ninguna cuenta. Sin fallback de email/password: si el seed esta
    # habilitado, ambas son obligatorias (mismo criterio "sin secreto
    # hardcodeado" que security.jwt.secret / spring.datasource.password de
    # arriba).
    enabled: ${ADMIN_SEED_ENABLED:false}
    email: ${ADMIN_SEED_EMAIL:}
    password: ${ADMIN_SEED_PASSWORD:}
    name: ${ADMIN_SEED_NAME:Administrador BIOPET}

sri:
  # Ambiente fiscal EFECTIVO de este despliegue: PRUEBAS o PRODUCCION. NUNCA lo
  # decide el cliente REST -ver SriAmbienteProperties-; el request de emision
  # ya no acepta ningun campo "ambiente". Default PRUEBAS, igual criterio que
  # sri.soap.*: un despliegue mal configurado falla hacia pruebas, nunca hacia
  # produccion por omision. SriAmbienteProperties valida al arrancar que este
  # valor sea coherente con los endpoints SOAP configurados abajo.
  ambiente: ${SRI_AMBIENTE:PRUEBAS}

  firma:
    certificado:
      # Ruta del PKCS#12 con la firma electronica de la clinica. Se monta como
      # fichero secreto en el despliegue; NUNCA se guarda en PostgreSQL ni en el
      # repositorio. Sin valor por defecto: un secreto con fallback no es un
      # secreto.
      path: ${SRI_CERT_PATH:}
      password: ${SRI_CERT_PASSWORD:}
      # Opcional: solo hace falta si el almacen contiene mas de una clave.
      alias: ${SRI_CERT_ALIAS:}
    # RSA_SHA1 es el perfil que describe la ficha tecnica del SRI. RSA_SHA256
    # esta implementado y probado, pero que BIOPET pueda generarlo no significa
    # que el SRI lo acepte: no se cambia sin comprobarlo antes contra CELCER.
    algoritmo: ${SRI_FIRMA_ALGORITMO:RSA_SHA1}

  # Las tres claves de arriba son OPCIONALES en el arranque a proposito: BIOPET
  # debe poder levantar sin certificado (entornos de desarrollo, CI, o una
  # clinica que aun no lo tiene). La ausencia se convierte en un error claro al
  # intentar firmar, no en un fallo de arranque que dejaria el sistema entero
  # inservible por no tener todavia el .p12.

  soap:
    # Endpoints de los web services offline del SRI. Los DEFAULTS SON CELCER
    # (ambiente de PRUEBAS) a proposito: un despliegue mal configurado debe
    # fallar hacia pruebas, nunca emitir comprobantes con validez tributaria
    # real por descuido. Produccion (cel.sri.gob.ec) se inyecta por variable de
    # entorno, de forma explicita y deliberada, y SriSoapProperties deja
    # constancia en el log con nivel WARN cuando detecta que apunta alli.
    #
    # Es la URL del ENDPOINT, sin el sufijo "?wsdl": ese devuelve el contrato,
    # no una respuesta de negocio. El arranque lo rechaza si se cuela.
    recepcion-url: ${SRI_SOAP_RECEPCION_URL:https://celcer.sri.gob.ec/comprobantes-electronicos-ws/RecepcionComprobantesOffline}
    autorizacion-url: ${SRI_SOAP_AUTORIZACION_URL:https://celcer.sri.gob.ec/comprobantes-electronicos-ws/AutorizacionComprobantesOffline}
    # Timeouts EXPLICITOS y finitos. Sin ellos HttpURLConnection espera
    # indefinidamente: un SRI que acepta la conexion y no responde dejaria un
    # hilo colgado para siempre. El de lectura es holgado porque la autorizacion
    # del SRI es lenta en horas punta, pero acotado.
    connect-timeout: ${SRI_SOAP_CONNECT_TIMEOUT:10s}
    read-timeout: ${SRI_SOAP_READ_TIMEOUT:60s}
    # Aqui no hay ningun secreto: los servicios offline del SRI no usan
    # credenciales. La identidad la aporta la firma XAdES del comprobante.

# Modulo administrativo de respaldos PostgreSQL (Proyecto Final de
# Administracion de Bases de Datos). Sin relacion con facturacion/SRI de
# arriba: no comparte ninguna tabla, credencial ni configuracion con ellos.
backup:
  # Directorio donde pg_dump escribe los .dump (-Fc). Se crea si no existe.
  # Sin default pensado para produccion: "./backups" alcanza para
  # desarrollo/demo, pero un despliegue real debe fijar una ruta persistente
  # explicita (ver docker-compose.yml, volumen dedicado del backend).
  storage-path: ${BACKUP_STORAGE_PATH:./backups}
  # Ejecutable de pg_dump. Portabilidad (riesgo ya observado): un servidor
  # PostgreSQL 18 con un pg_dump 16 en el PATH del sistema falla el respaldo
  # (pg_dump rechaza volcar una version de servidor mas nueva que la suya).
  # PG_DUMP_PATH permite fijar la ruta EXACTA al pg_dump correspondiente a la
  # version real del servidor de cada maquina, sin hardcodear ninguna ruta de
  # un sistema en particular. Si no se define, se intenta primero
  # BACKUP_PGDUMP_PATH (nombre historico de esta misma clave, se mantiene por
  # compatibilidad) y, si tampoco esta, "pg_dump" resuelto contra el PATH del
  # sistema -funciona solo si esa version coincide con la del servidor.
  # PgDumpExecutorImpl valida "pg_dump --version" ANTES de cada respaldo real;
  # si el ejecutable no existe o no responde, el respaldo queda FALLIDO con un
  # mensaje seguro, sin tumbar BIOPET.
  pg-dump-path: ${PG_DUMP_PATH:${BACKUP_PGDUMP_PATH:pg_dump}}
  # Tiempo maximo que se espera a que pg_dump termine antes de forzar su
  # cancelacion (destroyForcibly). Finito a proposito, mismo criterio que
  # sri.soap.read-timeout arriba: un proceso colgado no debe quedar
  # esperando para siempre.
  timeout-seconds: ${BACKUP_TIMEOUT_SECONDS:300}
  # Cada cuanto RespaldoScheduler revisa la configuracion vigente. NO es el
  # intervalo real entre respaldos -ese lo elige el ADMIN en
  # minutos/horas/dias desde la pantalla y se compara en cada revision
  # contra proximoRespaldoEn; ver el javadoc de RespaldoScheduler para el
  # porque no se usa un fixedRate igual a ese intervalo.
  scheduler-check-interval-ms: ${BACKUP_SCHEDULER_INTERVAL_MS:30000}
  # Conexion que usa pg_dump. Por defecto la MISMA base que usa el resto de
  # la aplicacion (spring.datasource.url, arriba) -no se duplica esa
  # configuracion. Usuario/password son los del rol PROPIETARIO del esquema
  # -DB_USER/DB_PASSWORD, las MISMAS variables que ya usa Flyway para
  # migrar (spring.flyway.user/password, arriba)-, NO
  # spring.datasource.username/password -biopet_app, de privilegio minimo-:
  # un volcado completo del esquema necesita los privilegios del
  # propietario que corrio las migraciones, no los del runtime de la
  # aplicacion. Ningun secreto nuevo.
  #
  # Se leen DB_USER/DB_PASSWORD directamente -NO como
  # "${spring.flyway.user:}"/"${spring.flyway.password:}"- a proposito:
  # spring.flyway.password (arriba) NO tiene default ("Sin fallback: un
  # secreto con fallback no es un secreto"), y BackupProperties es un
  # @ConfigurationProperties que Spring instancia SIEMPRE al arrancar,
  # incluso cuando Flyway esta deshabilitado (spring.flyway.enabled=false,
  # perfil "test"). Encadenar el default vacio aqui ("${spring.flyway.password:}")
  # no evita el fallo: Spring igual intenta resolver el valor CRUDO de
  # spring.flyway.password primero ("${DB_PASSWORD}", sin su propio
  # default) y esa resolucion interna falla ANTES de llegar al ":" de
  # afuera, tumbando el arranque de CUALQUIER test que no exporte
  # DB_PASSWORD -asi nunca vaya a generar un respaldo real. Leyendo
  # DB_PASSWORD como variable de entorno de nivel raiz, con su propio
  # default vacio explicito, esa resolucion nunca falla.
  pgdump-source-url: ${spring.datasource.url}
  pgdump-usuario: ${DB_USER:biopet_user}
  pgdump-password: ${DB_PASSWORD:}

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        # M-2: /actuator/info y /actuator/metrics no tienen ningun cliente,
        # monitor ni configuracion real que los consuma en BIOPET V2 (grep
        # sobre todo el repo sin resultados) y quedaban accesibles a
        # cualquier usuario autenticado (SecurityConfig solo declara
        # /actuator/health como publico; el resto cae bajo
        # anyRequest().authenticated(), sin restriccion adicional por rol).
        # Se exponen solo los endpoints realmente necesarios para el primer
        # deploy: health, que Render usa como healthCheckPath (ver
        # render.yaml) y que SecurityConfig ya mantiene publico y sin
        # autenticacion.
        include: health
