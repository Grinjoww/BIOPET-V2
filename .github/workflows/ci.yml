name: CI BIOPET

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar backend (tests + JaCoCo check)
        working-directory: Backend
        run: mvn -B clean verify

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (lockfile)
        working-directory: frontend
        run: npm ci

      - name: Build de produccion
        working-directory: frontend
        run: npm run build

  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar matriz de trazabilidad (bloque A.3.3 de la Guia)
        run: bash scripts/validate-traceability.sh
