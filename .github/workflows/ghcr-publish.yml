name: Publicar imagen backend en GHCR

# Publica la imagen Docker de Backend/Dockerfile en GitHub Container
# Registry (ghcr.io). Workflow NUEVO y separado de ci.yml (que no se
# toca): no interfiere con los 6 jobs de validacion existentes
# (backend-test, frontend-build, traceability, sql-audit, security-static,
# zap-baseline).
#
# Dos modos, exactamente como pide la Entrega Final:
#
#   1. ANTES DEL RELEASE (tag v1.0.0 todavia no existe): disparo manual
#      (workflow_dispatch) desde la pestana Actions de GitHub. Publica
#      SOLO una etiqueta tecnica basada en el SHA corto del commit
#      (ej. "sha-abc1234"), nunca "latest" ni un numero de version --
#      asi no se puede confundir con un release real.
#
#   2. RELEASE FINAL (cuando exista y se publique el tag v1.0.0 -- esta
#      tarea NO crea ese tag): el push del tag "v*" dispara el workflow
#      automaticamente y publica ADEMAS las etiquetas "1.0.0" y "latest".
#
# Requiere unicamente el GITHUB_TOKEN que GitHub Actions provee
# automaticamente en cada corrida (sin secretos nuevos que configurar),
# con los permisos declarados abajo (packages: write) para poder hacer
# push a ghcr.io. El repositorio/paquete debe ser publico (o el token de
# quien haga pull debe tener acceso) para que un tercero pueda hacer
# "docker pull" sin autenticarse -- ver docs/publicacion/PAQUETE-V1.0.0.md.

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

env:
  # Nombre real ya documentado en docs/publicacion/PAQUETE-V1.0.0.md
  # (seccion 4, "Datos necesarios para GHCR") antes de esta tarea. Se
  # reutiliza tal cual -- no se inventa un nombre distinto.
  IMAGE_NAME: ghcr.io/grinjoww/entregafinal-biopet-backend

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Disparo manual (antes del release): solo SHA corto.
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}
            # Push de un tag v* real (release final): version semver
            # ("v1.0.0" -> "1.0.0") + "latest". No se activa nunca por un
            # disparo manual ni por un push normal a main.
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build + push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: Backend
          file: Backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publicar digest real en el resumen de la corrida
        run: |
          {
            echo "## Imagen publicada en GHCR"
            echo ""
            echo "- Imagen: \`${{ env.IMAGE_NAME }}\`"
            echo "- Digest real (sha256): \`${{ steps.build.outputs.digest }}\`"
            echo "- Etiquetas publicadas:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Verificar con:"
            echo '```bash'
            echo "docker pull ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
            echo "docker buildx imagetools inspect ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
